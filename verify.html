<!doctype html><meta charset="utf-8"><title>ZeroHero browser inference verification</title><style>body{font:16px system-ui;padding:28px;background:#162d27;color:#e6f4db;max-width:900px}pre{white-space:pre-wrap}button{padding:12px;font:inherit}</style><h1>Browser inference verification</h1><p>Real WASM inference compared with frozen PyTorch token outputs. Both models run in a Web Worker.</p><button id="run">Run six comparisons</button><pre id="log" role="status">Ready</pre><script type="module">
const worker=new Worker('model-worker.js',{type:'module'}),log=document.getElementById('log');let next=0;
function run(ref){return new Promise((resolve,reject)=>{const id=++next;const fn=e=>{if(e.data.id!==id)return;worker.removeEventListener('message',fn);e.data.error?reject(Error(e.data.error)):resolve(e.data);};worker.addEventListener('message',fn);worker.postMessage({id,model:ref.model,prompt:ref.prompt,maxNew:32,greedy:true,base:new URL('./',location.href).href});});}
document.getElementById('run').onclick=async()=>{document.getElementById('run').disabled=true;log.textContent='Loading reference prompts…';try{const refs=await fetch('model-checks.json').then(r=>r.json());for(const ref of refs){log.textContent+=`\nRunning ${ref.model} ${ref.index}…`;const out=await run(ref);if(JSON.stringify(out.input)!==JSON.stringify(ref.input)||JSON.stringify(out.tokens)!==JSON.stringify(ref.output))throw Error('Token mismatch: '+ref.model+' '+ref.index);log.textContent+=' PASS';}log.textContent+='\nPASS: six browser/PyTorch comparisons; identical tokenization and generated token IDs.';}catch(e){log.textContent+='\nFAIL: '+e.message;}};
</script>
